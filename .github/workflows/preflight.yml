name: Preflight

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure core files exist
        run: |
          test -f index.html
          test -f sitemap.xml
          test -f robots.txt
          test -f CNAME

      - name: CNAME guard
        run: |
          cname="$(cat CNAME | tr -d '[:space:]')"
          test "$cname" = "dmarinternational.com"

      - name: Basic HTML/SEO guard rails
        run: |
          set -e
          test "$(find . -maxdepth 1 -name '*.html' | wc -l)" -gt 10
          grep -q '<title>' index.html
          grep -q 'rel="canonical"' index.html
          grep -q '<meta name="description"' index.html
          grep -q '<loc>https://dmarinternational.com/' sitemap.xml

      - name: Redirect rules sanity
        run: |
          grep -q '/case-studies.html  /projects.html  301' _redirects
          grep -q '/who-we-support.html  /developers-epci-shipowners-support.html  301' _redirects
          grep -q '/sea-fastening-stability-motion-review.html  /sea-fastening-stability-motions-review.html  301' _redirects

      - name: Link syntax quick check
        run: |
          # Fail only on clearly broken absolute hrefs in top-level html files.
          ! grep -RIn "href=\"\"" -- *.html
